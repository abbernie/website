	// Also respond to touch events
document.addEventListener('touchstart', initAudioOnFirstTouch, { once: true });

function initAudioOnFirstTouch() {
    // Create a muted audio context on first touch
    const silentContext = new AudioContext();
    const oscillator = silentContext.createOscillator();
    const gain = silentContext.createGain();
    gain.gain.value = 0;
    oscillator.connect(gain);
    gain.connect(silentContext.destination);
    oscillator.start();
    oscillator.stop(silentContext.currentTime + 0.1);
    
    // Now your main button will work
    console.log('Audio primed for user interaction');
}

let actx = null;

document.getElementById('audioStart').addEventListener('click', async () => {
    if (actx) return;
    
    try {
        // Create AudioContext
        actx = new (window.AudioContext || window.webkitAudioContext)();
        await actx.resume();
        
        // Hide button or change text
        document.getElementById('audioStart').style.display = 'none';
        document.getElementById('audioStart').style.background = '#666';
        document.getElementById('audioStart').disabled = true;
        
        // Initialize your existing audio code here
        initYourAudioApp();
        
    } catch (error) {
        console.error('Failed to start audio:', error);
        alert('Audio initialization failed. Please try again.');
    }
});
